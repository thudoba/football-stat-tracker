<div class="container mt-4 mb-5">
  <h2 class="mb-4">Create New Game</h2>

  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }

  <form (ngSubmit)="makeGame()">
    <!-- game info -->
    <h5 class="mt-3 mb-3 border-bottom pb-2">Game Info</h5>

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Home Team <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="homeTeamName"
          name="homeTeamName"
          placeholder="e.g. Los Angeles Rams"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">Away Team <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="awayTeamName"
          name="awayTeamName"
          placeholder="e.g. Atlanta Falcons"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label">Week <span class="text-danger">*</span></label>
        <input type="number" class="form-control" [(ngModel)]="week" name="week" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Game Date <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="gameDate"
          name="gameDate"
          placeholder="e.g. Sep 7, 2025"
        />
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check mb-2">
          <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="isCompleted"
            name="isCompleted"
            id="isCompleted"
          />
          <label class="form-check-label" for="isCompleted">Game Completed</label>
        </div>
      </div>
    </div>

    <!-- scores -->
    <h5 class="mt-4 mb-3 border-bottom pb-2">
      Scores <span class="text-muted fw-normal fs-6">(leave blank for upcoming games)</span>
    </h5>
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">Home Score</label>
        <input type="number" class="form-control" [(ngModel)]="homeScore" name="homeScore" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Away Score</label>
        <input type="number" class="form-control" [(ngModel)]="awayScore" name="awayScore" />
      </div>
    </div>

    <!-- home team stats -->
    <h5 class="mt-4 mb-3 border-bottom pb-2">
      Home Team Stats
      <span class="text-muted fw-normal fs-6">(leave blank for upcoming games)</span>
    </h5>
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label class="form-label">Total Yards</label>
        <input type="number" class="form-control" [(ngModel)]="htotYds" name="htotYds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Plays</label>
        <input type="number" class="form-control" [(ngModel)]="hply" name="hply" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Completions</label>
        <input type="number" class="form-control" [(ngModel)]="hcmp" name="hcmp" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Pass Attempts</label>
        <input type="number" class="form-control" [(ngModel)]="hpatt" name="hpatt" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Pass Yards</label>
        <input type="number" class="form-control" [(ngModel)]="hpyds" name="hpyds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Pass TDs</label>
        <input type="number" class="form-control" [(ngModel)]="hptds" name="hptds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Interceptions</label>
        <input type="number" class="form-control" [(ngModel)]="hint" name="hint" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rush Attempts</label>
        <input type="number" class="form-control" [(ngModel)]="hratt" name="hratt" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rush Yards</label>
        <input type="number" class="form-control" [(ngModel)]="hryds" name="hryds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rush TDs</label>
        <input type="number" class="form-control" [(ngModel)]="hrtds" name="hrtds" />
      </div>
    </div>

    <!-- away team stats -->
    <h5 class="mt-4 mb-3 border-bottom pb-2">
      Away Team Stats
      <span class="text-muted fw-normal fs-6">(leave blank for upcoming games)</span>
    </h5>
    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label class="form-label">Total Yards</label>
        <input type="number" class="form-control" [(ngModel)]="atotYds" name="atotYds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Plays</label>
        <input type="number" class="form-control" [(ngModel)]="aply" name="aply" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Completions</label>
        <input type="number" class="form-control" [(ngModel)]="acmp" name="acmp" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Pass Attempts</label>
        <input type="number" class="form-control" [(ngModel)]="apatt" name="apatt" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Pass Yards</label>
        <input type="number" class="form-control" [(ngModel)]="apyds" name="apyds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Pass TDs</label>
        <input type="number" class="form-control" [(ngModel)]="aptds" name="aptds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Interceptions</label>
        <input type="number" class="form-control" [(ngModel)]="aint" name="aint" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rush Attempts</label>
        <input type="number" class="form-control" [(ngModel)]="aratt" name="aratt" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rush Yards</label>
        <input type="number" class="form-control" [(ngModel)]="aryds" name="aryds" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rush TDs</label>
        <input type="number" class="form-control" [(ngModel)]="artds" name="artds" />
      </div>
    </div>

    <!-- submit -->
    <div class="mt-5">
      <button
        type="submit"
        class="btn btn-lg w-100"
        style="background-color: #6f42c1; color: white"
        [disabled]="saving"
      >
        {{ saving ? 'Saving...' : 'Make Game' }}
      </button>
    </div>
  </form>
</div>
