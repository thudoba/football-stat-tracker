<div class="container mt-4">
    <h1>Games</h1>
</div>

<div class="container mt-4">
  <div class="row">
    @for (game of filteredGames(); track game.id) {
       <div class="col-md-4 col-lg-3 mb-4">
         <div class="card h-100 text-center">
           <!-- <img [src]="team.logo" class="card-img-top p-3" [alt]="team.teamName || team.name"> -->
           <div class="card-body">
             <h5 class="card-title">{{gameStrings().find((value) => value.game == game)?.string}}</h5>
             <!-- <p class="card-text text-muted">{{ team.division }}</p> -->
             <a class="btn btn-primary" [routerLink]="['/games', game.id]">View Game</a>
           </div>
         </div>
       </div>
    } @empty {
      <div class="col-12 text-center text-white">
        <h3>No games found.</h3>
      </div>
    }
  </div>
</div>
